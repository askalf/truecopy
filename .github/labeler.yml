# Path → label map for .github/workflows/pr-triage.yml (actions/labeler v7).
#
# Additive only: sync-labels is off, so nothing here ever strips a label a
# human — or Dependabot — put on a PR by hand. Add a path, get a label.
#
# Label names match the Own Your Stack family vocabulary (redstamp is the
# reference): bare nouns, not `area:` prefixes, so a reader moving between
# repos sees the same words for the same things.

detection:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/scan.mjs'
          - 'src/gate.mjs'
          - 'src/claude.mjs'
          - 'src/index.mjs'

# The supply-chain core: what a pin IS, and how it is proven.
lockfile:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/lock.mjs'
          - 'src/hash.mjs'
          - 'src/sign.mjs'
          - 'src/keychain.mjs'
          - 'truecopy.lock'

cli:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/cli.mjs'
          - 'src/mcp-cli.mjs'

mcp:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/mcp.mjs'
          - 'src/mcp-serve.mjs'
          - 'src/mcp-cli.mjs'

# The marketplace watch: scanner harness, acceptance ledger, triage issues.
watch:
  - changed-files:
      - any-glob-to-any-file:
          - 'support/**'
          - '.github/workflows/marketplace-watch.yml'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'test/**'
          - '**/*.test.mjs'

fuzz:
  - changed-files:
      - any-glob-to-any-file:
          - 'fuzz/**'
          - '.clusterfuzzlite/**'

examples:
  - changed-files:
      - any-glob-to-any-file:
          - 'demo/**'

github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/labeler.yml'

docker:
  - changed-files:
      - any-glob-to-any-file:
          - 'Dockerfile'
          - 'Dockerfile.dockerignore'
          - 'docker/**'

# Prose only. Scoped to the docs that exist rather than a bare '**/*.md', so a
# PR shipping code plus its README paragraph is not filed as documentation.
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'README.md'
          - 'CHANGELOG.md'
          - 'CONTRIBUTING.md'
          - 'CODE_OF_CONDUCT.md'
          - 'SECURITY.md'
          - '.github/ISSUE_TEMPLATE/**'
          - '.github/pull_request_template.md'
