# Dogfood: this repo pins its own demo MCP manifest (demo/clean-mcp.json) in
# truecopy.lock and gates it with the published truecopy-action. If the demo
# manifest drifts — or a rule change re-classifies it — this fails until the
# change is consciously re-pinned.
name: truecopy gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: read-all

jobs:
  verify:
    name: verify pinned skills
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs this job on
    # truecopy-exec, the non-root one-job runners on our host, so its trusted runs no longer
    # wait on GitHub's hosted queue. A fork's PR and a Dependabot PR run code nobody here
    # wrote, so they stay on GitHub's runners.
    # A fork repository has no truecopy-exec runners, so every run there stays on GitHub's runners too.
    runs-on: ${{ (github.repository != 'askalf/truecopy' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","truecopy-exec"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: truecopy verify
        uses: askalf/truecopy-action@1c751a921d3bacb73f30c66054c7fe293ca6743d # v1.1.2
        with:
          verify-attestation: 'true'
