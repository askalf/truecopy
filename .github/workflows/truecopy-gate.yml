# Dogfood: this repo pins its own demo MCP manifest (demo/clean-mcp.json) in
# truecopy.lock and gates it with the published truecopy-action. If the demo
# manifest drifts — or a rule change re-classifies it — this fails until the
# change is consciously re-pinned.
name: truecopy gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: read-all

jobs:
  verify:
    name: verify pinned skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: truecopy verify
        uses: askalf/truecopy-action@f9492aba42bacb64b0af013a6dbc5c833121fe8e # v1.0.3
