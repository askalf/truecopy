name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '32 7 * * 1'

permissions:
  contents: read

# A PR's runs share one group per branch, so a new push cancels the superseded
# run. Push and schedule runs each get their own group (the run id): GitHub keeps
# only one pending run per group, so a shared group would let a newer push
# replace a queued default-branch run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    # CodeQL runs on GitHub's runners: it sizes itself to the machine, and the exec runners of every repo share one host, so concurrent analyses would exhaust its memory.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write # upload the CodeQL SARIF
    strategy:
      fail-fast: false
      matrix:
        # `actions` scans the workflows themselves: expression injection, untrusted
        # checkouts under pull_request_target, over-broad token permissions.
        language: [javascript-typescript, actions]
    steps:
      - uses: askalf/ci/actions/checkout-with-retry@6479de99a4bf3897d3c09efc7b3d6f24721bf30e # main 2026-11-09, askalf/ci#194
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
