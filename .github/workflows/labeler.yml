name: Label PRs

# Applies the path-based area labels in .github/labeler.yml to every PR.
#
# WHY pull_request_target: a PR from a fork gets a READ-ONLY token on the
# `pull_request` event, so labeling would silently no-op on exactly the
# contributions that most need triage. `pull_request_target` runs with the base
# repo's token instead.
#
# That event is the classic fork-RCE vector — but only when a workflow CHECKS
# OUT and EXECUTES the fork's code with those credentials. This job checks out
# nothing and runs nothing from the PR: actions/labeler reads the changed-file
# LIST from the API and applies labels. The fork's contents never touch the
# runner. Keep it that way — do not add a checkout step here, and do not add
# any step that runs repository code.
#
# Labels are additive by design (sync-labels stays false): a maintainer's manual
# `blocked` or `good first issue` must survive the next push, and a bot that
# strips human triage on every commit is worse than no bot.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read # read .github/labeler.yml from the BASE branch
      pull-requests: write # apply the labels
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
